[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-name"
version = "0.1.0"
description = "Project description"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Yongbo Yu" },
]
dependencies = []

# [project.urls]
# Repository = "https://github.com/YongboYu/project-name"

# =============================================================================
# Dev dependencies 
# =============================================================================
# Install: uv sync --group dev

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "bandit[toml]>=1.8",
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

# =============================================================================
# Hatchling build config 
# =============================================================================

[tool.hatch.build.targets.wheel]
packages = ["src/package_name"]

# =============================================================================
# Ruff — linting + formatting 
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (overlap with bandit, but fast)
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (formatter handles this)
    "S101",   # assert usage (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["package_name"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# =============================================================================
# mypy — static type checking
# =============================================================================

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false       # set true when ready for strict mode
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "src"

# =============================================================================
# pytest + coverage
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# fail_under = 60  # uncomment when ready to enforce coverage threshold

# =============================================================================
# bandit — security linting
# =============================================================================

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
